name: Pixso bidirectional sync

on:
  push:
    branches: [beta]
    paths:
      - 'app/src/main/java/com/mok/buylist/ui/theme/Theme.kt'
      - 'scripts/pixso-*.py'
      - 'scripts/pixso-*.js'
      - 'scripts/test-pixso-sync.py'
      - 'design/pixso-sync.json'
      - 'design/pixso-baseline.json'
      - '.github/workflows/pixso-sync.yml'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Apply non-conflicting mapped palette changes'
        type: boolean
        default: true
      release:
        description: 'Request signed beta release after successful sync'
        type: boolean
        default: false
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: pixso-sync-beta
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: beta
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python scripts/test-pixso-sync.py

  sync:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: beta
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install MCP client
        run: python -m pip install --disable-pip-version-check 'mcp==1.26.0'
      - name: Check connection
        env:
          PIXSO_ACCESS_TOKEN: ${{ secrets.PIXSO_ACCESS_TOKEN }}
        run: |
          if [[ -z "$PIXSO_ACCESS_TOKEN" ]]; then
            echo "::error::Add PIXSO_ACCESS_TOKEN in repository Actions secrets"
            exit 1
          fi
      - name: Compare and sync
        env:
          PIXSO_ACCESS_TOKEN: ${{ secrets.PIXSO_ACCESS_TOKEN }}
          APPLY: ${{ github.event_name != 'workflow_dispatch' || inputs.apply }}
        run: |
          set -euo pipefail
          git fetch origin beta
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/beta)"
          args=()
          if [[ "$APPLY" == "true" ]]; then args+=(--apply); fi
          python scripts/pixso-sync.py "${args[@]}"
      - name: Commit synchronized changes to beta
        id: commit
        run: |
          set -euo pipefail
          git add -- design/pixso-baseline.json app/src/main/java/com/mok/buylist/ui/theme/Theme.kt
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'design: sync Pixso semantic palette'
          git push origin HEAD:beta
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Request beta capture or release
        if: steps.commit.outputs.changed == 'true' || (github.event_name == 'workflow_dispatch' && inputs.apply && inputs.release)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
        run: gh workflow run figma-redesign-apk.yml --ref beta -f "publish=$RELEASE"
      - name: Upload sync report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pixso-sync-report
          path: pixso-sync-report/
          if-no-files-found: ignore
          retention-days: 30

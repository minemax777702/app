name: Multi-catalog Android checks

on:
  pull_request:
    paths:
      - "app/**"
      - "docs/MULTI_CATALOG_IMPLEMENTATION.md"
      - ".github/workflows/multi-catalog-checks.yml"
  workflow_dispatch:

concurrency:
  group: multi-catalog-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK for source validation
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Test and compile (CI SDK 36 fallback only)
        run: |
          sed -i 's/release(37)/release(36)/g' app/build.gradle.kts
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:kspDebugKotlin -x :app:checkDebugAarMetadata --stacktrace --no-daemon
      - name: Upload generated Room schema
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-schema-v24
          path: app/schemas/com.mok.buylist.data.AppDatabase/24.json
          if-no-files-found: ignore

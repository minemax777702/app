name: Multi-catalog Android checks

on:
  pull_request:
    paths:
      - "app/**"
      - "docs/MULTI_CATALOG_IMPLEMENTATION.md"
      - ".github/workflows/multi-catalog-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android API 37
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" "build-tools;37.0.0"
      - name: Test and compile
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:kspDebugKotlin --stacktrace --no-daemon
      - name: Upload generated Room schema
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-schema-v20
          path: app/schemas/com.mok.buylist.data.AppDatabase/20.json
          if-no-files-found: ignore

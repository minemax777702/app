name: FRESH CUT UI check

on:
  push:
    branches: [feat/figma-redesign]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[ui-check]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Install required Android SDK packages
        shell: bash
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk_root"
          sdkmanager="$(command -v sdkmanager || true)"
          if [ -z "$sdkmanager" ]; then
            sdkmanager="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          fi
          test -x "$sdkmanager"
          "$sdkmanager" --sdk_root="$sdk_root" --install "cmdline-tools;latest"
          sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          "$sdkmanager" --version
          "$sdkmanager" --sdk_root="$sdk_root" --install "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"
          test -f "$sdk_root/platforms/android-37.0/android.jar"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile debug and run JVM tests
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew :app:compileDebugKotlin :app:testDebugUnitTest --stacktrace --no-daemon

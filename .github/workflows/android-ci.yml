name: Android CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: JVM tests, release build, Room schema
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The repository pins Gradle's daemon JVM to Java 25.
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 37
        run: |
          sdkmanager --install "platforms;android-37" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run JVM tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Check committed Room schema
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          source = Path("app/src/main/java/com/mok/buylist/data/AppDatabase.kt").read_text()
          match = re.search(r"@Database\\s*\\([\\s\\S]*?version\\s*=\\s*(\\d+)", source)
          if match is None:
              raise SystemExit("Could not determine Room database version")
          version = match.group(1)
          schema = Path("app/schemas/com.mok.buylist.data.AppDatabase") / f"{version}.json"
          if not schema.is_file():
              raise SystemExit(f"Missing Room schema: {schema}. Commit the generated file.")
          print(f"Room schema version {version}: {schema}")
          PY
          if ! git diff --quiet -- app/schemas || test -n "$(git ls-files --others --exclude-standard -- app/schemas)"; then
            echo "::error::Room schema differs from committed files. Regenerate and commit app/schemas."
            git status --short -- app/schemas
            exit 1
          fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload generated Room schemas for review
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: app/schemas/
          if-no-files-found: ignore
          retention-days: 7

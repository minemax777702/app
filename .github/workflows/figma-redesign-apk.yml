name: FRESH CUT APK

on:
  push:
    branches: [feat/figma-redesign]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
    concurrency:
      group: fresh-cut-apk-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Install required Android SDK packages
        shell: bash
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk_root"
          sdkmanager="$(command -v sdkmanager || true)"
          if [ -z "$sdkmanager" ]; then
            sdkmanager="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          fi
          test -x "$sdkmanager"
          if [ ! -x "$sdk_root/cmdline-tools/latest/bin/sdkmanager" ]; then
            "$sdkmanager" --sdk_root="$sdk_root" --install "cmdline-tools;latest"
          fi
          sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          packages=()
          [ -x "$sdk_root/platform-tools/adb" ] || packages+=("platform-tools")
          [ -f "$sdk_root/platforms/android-37.0/android.jar" ] || packages+=("platforms;android-37.0")
          [ -x "$sdk_root/build-tools/37.0.0/apksigner" ] || packages+=("build-tools;37.0.0")
          if [ "${#packages[@]}" -gt 0 ]; then
            "$sdkmanager" --sdk_root="$sdk_root" --install "${packages[@]}"
          fi
          test -f "$sdk_root/platforms/android-37.0/android.jar"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/feat/figma-redesign' }}
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Build and verify signed release APK
        shell: bash
        env:
          BUYLIST_KEYSTORE_BASE64: ${{ secrets.BUYLIST_KEYSTORE_BASE64 }}
          BUYLIST_STORE_PASSWORD: ${{ secrets.BUYLIST_STORE_PASSWORD }}
          BUYLIST_KEY_ALIAS: ${{ secrets.BUYLIST_KEY_ALIAS }}
          BUYLIST_KEY_PASSWORD: ${{ secrets.BUYLIST_KEY_PASSWORD }}
        run: |
          set -eu
          for variable in BUYLIST_KEYSTORE_BASE64 BUYLIST_STORE_PASSWORD BUYLIST_KEY_ALIAS BUYLIST_KEY_PASSWORD; do
            if [ -z "${!variable}" ]; then
              echo "::error::Missing GitHub Actions secret: $variable"
              exit 1
            fi
          done
          umask 077
          export BUYLIST_STORE_FILE="$RUNNER_TEMP/buylist-release.p12"
          trap 'rm -f "$BUYLIST_STORE_FILE"' EXIT
          printf '%s' "$BUYLIST_KEYSTORE_BASE64" | base64 --decode > "$BUYLIST_STORE_FILE"
          unset BUYLIST_KEYSTORE_BASE64
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --stacktrace --build-cache
          "${ANDROID_HOME}/build-tools/37.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fresh-cut-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

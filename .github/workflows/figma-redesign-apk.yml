name: FRESH CUT APK

on:
  push:
    branches: [beta, main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'design/**'
      - 'scripts/pixso-*'
      - 'scripts/test-pixso-sync.py'
      - '.github/workflows/pixso-sync.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish signed APK after checks (false = do not publish)'
        type: boolean
        default: true
      candidate:
        description: 'Build signed beta APK without publishing (set publish=false)'
        type: boolean
        default: false
      adaptive_audit:
        description: 'Also capture small screens, large fonts and keyboard (beta only)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    if: (github.ref == 'refs/heads/beta' || github.ref == 'refs/heads/main') && ((github.event_name == 'workflow_dispatch' && inputs.publish) || contains(github.event.head_commit.message, '[release]') || (github.ref == 'refs/heads/beta' && ((github.event_name == 'workflow_dispatch' && inputs.candidate) || contains(github.event.head_commit.message, '[beta-candidate]'))))
    concurrency:
      group: fresh-cut-apk-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Determine version and channel
        id: version
        shell: bash
        run: |
          set -eu
          base="$(sed -n 's/^buylist.version=//p' gradle.properties)"
          [[ "$base" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          code=$((1000 + GITHUB_RUN_NUMBER))
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            channel=stable
            version="$base"
          else
            channel=beta
            version="$base-beta.$code"
          fi
          echo "BUYLIST_VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "BUYLIST_VERSION_NAME=$version" >> "$GITHUB_ENV"
          echo "tag=$channel-v$base-$code" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Install required Android SDK packages
        shell: bash
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk_root"
          sdkmanager="$(command -v sdkmanager || true)"
          if [ -z "$sdkmanager" ]; then
            sdkmanager="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          fi
          test -x "$sdkmanager"
          if [ ! -x "$sdk_root/cmdline-tools/latest/bin/sdkmanager" ]; then
            "$sdkmanager" --sdk_root="$sdk_root" --install "cmdline-tools;latest"
          fi
          sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          packages=()
          [ -x "$sdk_root/platform-tools/adb" ] || packages+=("platform-tools")
          [ -f "$sdk_root/platforms/android-37.0/android.jar" ] || packages+=("platforms;android-37.0")
          [ -x "$sdk_root/build-tools/37.0.0/apksigner" ] || packages+=("build-tools;37.0.0")
          if [ "${#packages[@]}" -gt 0 ]; then
            "$sdkmanager" --sdk_root="$sdk_root" --install "${packages[@]}"
          fi
          test -f "$sdk_root/platforms/android-37.0/android.jar"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Build and verify signed release APK
        shell: bash
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          BUYLIST_KEYSTORE_BASE64: ${{ secrets.BUYLIST_KEYSTORE_BASE64 }}
          BUYLIST_STORE_PASSWORD: ${{ secrets.BUYLIST_STORE_PASSWORD }}
          BUYLIST_KEY_ALIAS: ${{ secrets.BUYLIST_KEY_ALIAS }}
          BUYLIST_KEY_PASSWORD: ${{ secrets.BUYLIST_KEY_PASSWORD }}
        run: |
          set -eu
          for variable in BUYLIST_KEYSTORE_BASE64 BUYLIST_STORE_PASSWORD BUYLIST_KEY_ALIAS BUYLIST_KEY_PASSWORD; do
            if [ -z "${!variable}" ]; then
              echo "::error::Missing GitHub Actions secret: $variable"
              exit 1
            fi
          done
          umask 077
          export BUYLIST_STORE_FILE="$RUNNER_TEMP/buylist-release.p12"
          trap 'rm -f "$BUYLIST_STORE_FILE"' EXIT
          printf '%s' "$BUYLIST_KEYSTORE_BASE64" | base64 --decode > "$BUYLIST_STORE_FILE"
          unset BUYLIST_KEYSTORE_BASE64
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleRelease --stacktrace --build-cache
          "${ANDROID_HOME}/build-tools/37.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          test -s app/build/outputs/mapping/release/mapping.txt
          bytes="$(stat -c %s app/build/outputs/apk/release/app-release.apk)"
          echo "Signed optimized Release APK: $bytes bytes" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload R8 mapping
        uses: actions/upload-artifact@v6
        with:
          name: fresh-cut-r8-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 90
      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: fresh-cut-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [build, ui-handoff]
    if: ${{ always() && !cancelled() && needs.build.result == 'success' && ((github.event_name == 'workflow_dispatch' && inputs.publish) || contains(github.event.head_commit.message, '[release]')) && (github.ref == 'refs/heads/main' || (github.ref == 'refs/heads/beta' && needs.ui-handoff.result == 'success')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    concurrency:
      group: publish-apk-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v7
        with:
          name: fresh-cut-release
          path: release
      - name: Publish signed APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
          CHANNEL: ${{ needs.build.outputs.channel }}
        shell: bash
        run: |
          set -eu
          test -s release/app-release.apk
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; leaving published assets unchanged."
            exit 0
          fi
          args=(--repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$VERSION" --generate-notes)
          if [[ "$CHANNEL" == "beta" ]]; then
            args+=(--prerelease --latest=false)
          else
            args+=(--latest)
          fi
          # Optional user-facing notes in the commit body, followed by GitHub's generated history.
          notes="$(git log -1 --format=%b | sed -n '/^Changelog:$/,$p' | tail -n +2)"
          if [[ -n "$notes" ]]; then
            args+=(--notes "$notes")
          fi
          gh release create "$TAG" release/app-release.apk "${args[@]}"
      - name: Rotate published Beta releases
        if: needs.build.outputs.channel == 'beta'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          gh api --paginate "repos/$repo/releases?per_page=100" | jq -s -r 'add | map(select(.prerelease and (.draft|not) and (.tag_name|test("^beta-v[0-9]+\\.[0-9]+\\.[0-9]+-[0-9]+$")))) | sort_by(.published_at) | reverse | .[10:][] | .tag_name' > "$RUNNER_TEMP/old-beta-tags"
          while IFS= read -r tag; do
            code="${tag##*-}"
            number=$((code - 1000))
            runs="$(gh api --paginate "repos/$repo/actions/workflows/figma-redesign-apk.yml/runs?branch=beta&per_page=100" | jq -s -r --argjson n "$number" '.[].workflow_runs[] | select(.run_number == $n and .head_branch == "beta") | .id')"
            for run in $runs; do
              gh api --paginate "repos/$repo/actions/runs/$run/artifacts?per_page=100" | jq -r '.artifacts[] | select(.name == "fresh-cut-release" or .name == "fresh-cut-r8-mapping") | .id' > "$RUNNER_TEMP/old-beta-artifacts"
              while IFS= read -r artifact; do
                gh api --method DELETE "repos/$repo/actions/artifacts/$artifact"
              done < "$RUNNER_TEMP/old-beta-artifacts"
            done
            gh release delete "$tag" --repo "$repo" --cleanup-tag --yes
          done < "$RUNNER_TEMP/old-beta-tags"

  ui-handoff:
    permissions:
      contents: read
      actions: read
    needs: build
    if: ${{ always() && github.ref == 'refs/heads/beta' && (needs.build.result == 'success' || (needs.build.result == 'skipped' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.adaptive_audit && 60 || 35 }}
    concurrency:
      group: ui-handoff-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Install required Android SDK packages
        shell: bash
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk_root"
          sdkmanager="$(command -v sdkmanager || true)"
          if [ -z "$sdkmanager" ]; then
            sdkmanager="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          fi
          test -x "$sdkmanager"
          if [ ! -x "$sdk_root/cmdline-tools/latest/bin/sdkmanager" ]; then
            "$sdkmanager" --sdk_root="$sdk_root" --install "cmdline-tools;latest"
          fi
          sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          packages=()
          [ -x "$sdk_root/platform-tools/adb" ] || packages+=("platform-tools")
          [ -f "$sdk_root/platforms/android-37.0/android.jar" ] || packages+=("platforms;android-37.0")
          [ -x "$sdk_root/build-tools/37.0.0/apksigner" ] || packages+=("build-tools;37.0.0")
          if [ "${#packages[@]}" -gt 0 ]; then
            "$sdkmanager" --sdk_root="$sdk_root" --install "${packages[@]}"
          fi
          test -f "$sdk_root/platforms/android-37.0/android.jar"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "$sdk_root/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"
      - uses: gradle/actions/setup-gradle@v5
      - uses: supabase/setup-cli@v1
        with:
          version: 2.39.2
      - name: Start disposable Supabase and seed fixtures
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/capture-db"
          cd "$RUNNER_TEMP/capture-db"
          supabase init
          supabase start
          supabase status -o env > "$RUNNER_TEMP/capture-env"
          set -a
          source "$RUNNER_TEMP/capture-env"
          set +a
          export CAPTURE_DB_URL="$DB_URL" CAPTURE_SERVICE_KEY="$SERVICE_ROLE_KEY"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/schema.sql"
          for migration in groups_as_list_containers timestamp_ordered_metadata allow_member_leave_group transfer_group_owner_and_leave user_lenta_settings 20261127231642_optimize_group_owner_index 20261127231645_consolidate_group_member_update_policy; do
            psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/migrations/$migration.sql"
          done
          test -n "$ANON_KEY"
          echo "::add-mask::$SERVICE_ROLE_KEY"
          export CAPTURE_SUPABASE_KEY="$ANON_KEY"
          python3 "$GITHUB_WORKSPACE/scripts/seed-ui-supabase.py"
          echo "CAPTURE_SUPABASE_KEY=$ANON_KEY" >> "$GITHUB_ENV"
      - name: Build isolated capture APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleUiCapture --build-cache
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test capture recovery
        run: |
          python3 scripts/test-capture-ui.py
          python3 -m py_compile scripts/capture-adaptive-ui.py
          python3 scripts/test-ui-release-gate.py
      - name: Capture real release UI
        uses: reactivecircus/android-emulator-runner@v2
        env:
          CAPTURE_VERSION: ${{ needs.build.outputs.version || format('beta-ui-{0}', github.run_number) }}
          ADAPTIVE_AUDIT: ${{ github.event_name == 'workflow_dispatch' && inputs.adaptive_audit }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: adb install -g app/build/outputs/apk/uiCapture/app-uiCapture.apk && CAPTURE_FIXTURE=1 python3 scripts/capture-ui.py && ( [ "$ADAPTIVE_AUDIT" != "true" ] || CAPTURE_FIXTURE=1 python3 scripts/capture-adaptive-ui.py )
      - name: Upload adaptive UI audit
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.adaptive_audit }}
        uses: actions/upload-artifact@v6
        with:
          name: fresh-cut-adaptive-ui-audit
          path: ui-adaptive-audit/
          if-no-files-found: warn
          compression-level: 1
          retention-days: 30
      - name: Verify complete UI coverage for current commit
        if: ${{ always() && hashFiles('ui-handoff/manifest.json') != '' }}
        run: |
          python3 scripts/ui-release-gate.py --registry design/pixso-sync.json --handoff ui-handoff --commit "$GITHUB_SHA"
      - name: Prepare Pixso incremental update plan
        run: |
          python3 scripts/plan-pixso-sync.py --registry design/pixso-sync.json --handoff ui-handoff --output pixso-sync-input
      - name: Upload Pixso update inputs
        uses: actions/upload-artifact@v6
        with:
          name: pixso-sync-input
          path: pixso-sync-input/
          if-no-files-found: error
          retention-days: 30
      - name: Collect changes and compare last capture
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          mkdir -p ui-handoff
          git log -1 --format=fuller > ui-handoff/commit.txt
          if [ -n "$BEFORE" ] && [[ ! "$BEFORE" =~ ^0+$ ]] && gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$GITHUB_SHA" --jq '.files[] | [.status,.filename] | @tsv' > ui-handoff/changed-files.txt; then
            :
          else
            git show --format= --name-status HEAD > ui-handoff/changed-files.txt
          fi
          if [ -f ui-handoff/manifest.json ]; then
            python3 scripts/compare-ui.py
          fi
      - name: Upload UI handoff
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: fresh-cut-ui-handoff
          path: ui-handoff/
          if-no-files-found: error
          compression-level: 1
          retention-days: 30

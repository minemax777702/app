name: FRESH CUT APK

on:
  push:
    branches: [feat/figma-redesign]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Install required Android SDK packages
        shell: bash
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk_root"
          sdkmanager="$(command -v sdkmanager || true)"
          if [ -z "$sdkmanager" ]; then
            sdkmanager="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          fi
          test -x "$sdkmanager"
          "$sdkmanager" --sdk_root="$sdk_root" --install "cmdline-tools;latest"
          sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          "$sdkmanager" --version
          "$sdkmanager" --sdk_root="$sdk_root" --list --channel=3 > "$RUNNER_TEMP/android-sdk-packages.txt"
          grep -E 'platforms;android-37|CinnamonBun|build-tools;37' "$RUNNER_TEMP/android-sdk-packages.txt" || true
          "$sdkmanager" --sdk_root="$sdk_root" --install "platform-tools" "build-tools;36.0.0"
          if ! "$sdkmanager" --sdk_root="$sdk_root" --install "platforms;android-37"; then
            "$sdkmanager" --sdk_root="$sdk_root" --channel=3 --install "platforms;android-37"
          fi
          test -f "$sdk_root/platforms/android-37/android.jar"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build signed release APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --stacktrace --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fresh-cut-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Run JVM tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace --no-daemon
